<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Project Demos — Ahmed Amin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#242721;font:15px 'DM Sans',sans-serif}header{padding:25px max(25px,7vw);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #deded8}a{color:inherit}header a{text-decoration:none;font-weight:700}main{max-width:1150px;margin:70px auto;padding:0 24px}h1{font:600 clamp(38px,7vw,78px) 'Space Grotesk';letter-spacing:-.06em;margin:0 0 15px}p{color:#6b6e66;line-height:1.7}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0}.tabs button,.add,.filter{padding:12px 17px;border:1px solid #c8ccc5;background:transparent;cursor:pointer;font:inherit}.tabs button.active,.add{background:#242721;color:white}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.item{background:white;padding:20px;border:1px solid #e1e2dc}.tile{height:180px;background:#dce2d8;display:grid;place-items:center;font:600 54px 'Space Grotesk';color:#50765c}.item:nth-child(2) .tile{background:#e9d6c7;color:#9e6d4d}.item:nth-child(3) .tile{background:#cfd7dc;color:#577480}.item h3{font:600 24px 'Space Grotesk'}.price{display:flex;justify-content:space-between;align-items:center}.cart{border-top:1px solid #ddd;padding:26px 0;margin-top:40px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:30px 0}.metric{padding:25px;background:white;border:1px solid #ddd}.metric small{display:block;color:#7e8179}.metric b{display:block;font:600 44px 'Space Grotesk';margin:10px 0}.chart{height:240px;display:flex;align-items:end;gap:14px;padding:20px;background:white}.chart i{flex:1;background:#91afa4}.studio{background:#e9c6ae;padding:55px 7vw;min-height:520px}.studio strong{font:700 20px 'Space Grotesk'}.studio h2{font:600 clamp(65px,12vw,148px)/.95 'Space Grotesk';letter-spacing:-.08em;margin:75px 0 25px}.studio em{color:#ac5940;font-style:normal}.studio button{background:#252721;color:#fff;border:0;padding:18px 30px;font:inherit;cursor:pointer}@media(max-width:650px){.cards,.metrics{grid-template-columns:1fr}main{margin:40px auto}.studio{padding:30px;min-height:400px}.studio h2{margin-top:65px}}</style></head><body><header><a href="index.html">← Back to portfolio</a><b>AHMED AMIN / LAB</b></header><main id="app"></main><script>const p=new URLSearchParams(location.search).get('project');const root=document.getElementById('app');if(p==='dashboard'){root.innerHTML=`<small>INTERACTIVE FRONT-END DEMO / 02</small><h1>Metric dashboard.</h1><p>A responsive performance dashboard concept with period switching and animated charts.</p><div class="tabs"><button class="active" data-period="week">This week</button><button data-period="month">This month</button><button data-period="year">This year</button></div><div class="metrics"><div class="metric"><small>Visitors</small><b id="visitors">24,680</b>↗ 12.8%</div><div class="metric"><small>Conversions</small><b id="conv">1,482</b>↗ 8.2%</div><div class="metric"><small>Engagement</small><b id="eng">68%</b>↗ 4.1%</div></div><div class="chart" id="chart"></div>`;const sets={week:[[40,55,50,78,62,90,74],['24,680','1,482','68%']],month:[[50,58,65,63,75,82,95],['96,420','5,844','71%']],year:[[30,42,40,55,65,77,96],['1.2M','72,610','74%']]};const render=k=>{const d=sets[k];document.getElementById('chart').innerHTML=d[0].map(v=>`<i style="height:${v}%"></i>`).join('');['visitors','conv','eng'].forEach((id,i)=>document.getElementById(id).textContent=d[1][i])};render('week');document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-period]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.period)})}else if(p==='studio'){root.innerHTML=`<small>INTERACTIVE FRONT-END DEMO / 03</small><h1>Forma studio.</h1><p>A small landing-page experiment in typography, contrast and purposeful micro-interactions.</p><div class="studio"><strong>forma / independent creative studio</strong><h2>Ideas made<br><em>visible.</em></h2><button id="hello">Start a conversation ↗</button><p id="message" aria-live="polite"></p></div>`;document.getElementById('hello').onclick=()=>document.getElementById('message').textContent='Great ideas start with a hello. Email: ahmeddev1214@gmail.com'}else{root.innerHTML=`<small>INTERACTIVE FRONT-END DEMO / 01</small><h1>Northline shop.</h1><p>A compact storefront with real category filters and functional cart interactions. Demo products only.</p><div class="tabs"><button class="active" data-filter="All">All</button><button data-filter="Home">Home</button><button data-filter="Desk">Desk</button></div><div class="cards" id="products"></div><div class="cart" id="cart" aria-live="polite">Cart: 0 items — $0</div>`;const items=[{name:'Clay Vase',category:'Home',price:42,symbol:'◡'},{name:'Desk Lamp',category:'Desk',price:89,symbol:'✳'},{name:'Linen Tray',category:'Home',price:28,symbol:'▱'}];let cart=[];function paint(f='All'){document.getElementById('products').innerHTML=items.filter(x=>f==='All'||x.category===f).map(x=>`<div class="item"><div class="tile">${x.symbol}</div><small>${x.category}</small><h3>${x.name}</h3><div class="price"><b>$${x.price}</b><button class="add" data-add="${x.name}">Add +</button></div></div>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{cart.push(items.find(i=>i.name===b.dataset.add));document.getElementById('cart').textContent='Cart: '+cart.length+' item(s) — $'+cart.reduce((a,i)=>a+i.price,0)})}paint();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');paint(b.dataset.filter)})}</script></body></html>
